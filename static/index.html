<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus CRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <canvas id="confetti"></canvas>

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><i data-lucide="hexagon"></i></div>
      <div><b>Nexus</b><span>CRM Suite</span></div>
      <button class="icon-btn sm collapse-btn" id="collapseBtn" title="Collapse sidebar"><i data-lucide="chevrons-left"></i></button>
    </div>

    <nav id="nav"></nav>

    <div class="target-card">
      <small>This month's target</small>
      <b id="sideTarget">—</b>
      <div class="progress"><i id="sideTargetBar" style="width:0"></i></div>
    </div>

    <div class="user">
      <div class="avatar" id="meAvatar"></div>
      <div class="me"><b id="meName"></b><span id="meEmail"></span></div>
      <button class="icon-btn sm danger" id="logoutBtn" title="Log out"><i data-lucide="log-out"></i></button>
    </div>
  </aside>
  <div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" onclick="document.body.classList.toggle('nav-open')"><i data-lucide="menu"></i></button>
      <div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>

      <div class="search" onclick="openPalette()">
        <i data-lucide="search"></i><span>Search or jump to…</span><kbd>Ctrl K</kbd>
      </div>

      <button class="icon-btn" id="themeBtn" title="Toggle theme"><i data-lucide="sun"></i></button>

      <div class="relative">
        <button class="icon-btn bell" id="bellBtn" title="Notifications"><i data-lucide="bell"></i><span class="dot" id="bellDot"></span></button>
        <div class="pop" id="bellPop" hidden></div>
      </div>

      <div class="relative">
        <button class="btn btn-primary new-btn" id="newBtn"><i data-lucide="plus"></i><span>New</span></button>
        <div class="pop small" id="newPop" hidden></div>
      </div>
    </header>

    <section id="view" class="view"></section>
  </main>

  <!-- ================= OVERLAYS ================= -->
  <div class="drawer-bg" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer"></aside>

  <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

  <div class="modal" id="palette">
    <div class="modal-box palette">
      <div class="palette-input"><i data-lucide="search"></i><input id="paletteInput" placeholder="Type a command or search…" autocomplete="off" /></div>
      <div id="paletteList"></div>
      <div class="palette-foot"><span>↑↓ to move</span><span>↵ to open</span><span>esc to close</span></div>
    </div>
  </div>

  <div id="toasts"></div>

  <!-- libraries (stored locally, work offline) -->
  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/vendor/lucide.min.js"></script>

  <!-- our code: plain functions, one file per page -->
  <script src="/static/js/helpers.js"></script>
  <script src="/static/js/forms.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/contacts.js"></script>
  <script src="/static/js/companies.js"></script>
  <script src="/static/js/deals.js"></script>
  <script src="/static/js/tasks.js"></script>
  <script src="/static/js/activity.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>

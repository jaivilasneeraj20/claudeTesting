<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus CRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/vendor/lucide.min.js"></script>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo"><i data-lucide="hexagon"></i></div>
      <div><b>Nexus</b><span>CRM Suite</span></div>
    </div>

    <nav id="nav">
      <p class="nav-label">Main</p>
      <a data-view="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a data-view="contacts"><i data-lucide="users"></i><span>Contacts</span><em id="cnt-contacts"></em></a>
      <a data-view="companies"><i data-lucide="building-2"></i><span>Companies</span><em id="cnt-companies"></em></a>
      <p class="nav-label">Sales</p>
      <a data-view="deals"><i data-lucide="kanban"></i><span>Deals Pipeline</span><em id="cnt-deals"></em></a>
      <a data-view="tasks"><i data-lucide="check-circle-2"></i><span>Tasks</span><em id="cnt-tasks"></em></a>
    </nav>

    <div class="side-card">
      <i data-lucide="sparkles"></i>
      <b>Close more deals</b>
      <p>Drag deals across the pipeline to update their stage instantly.</p>
      <button class="btn btn-primary sm" onclick="go('deals')">Open pipeline</button>
    </div>

    <div class="user">
      <div class="avatar" style="--h:260">AD</div>
      <div><b>Admin</b><span>admin@nexus.crm</span></div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme"><i data-lucide="moon"></i></button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" onclick="document.body.classList.toggle('nav-open')"><i data-lucide="menu"></i></button>
      <div>
        <h1 id="title">Dashboard</h1>
        <p id="subtitle" class="muted"></p>
      </div>
      <div class="search" onclick="openSearch()">
        <i data-lucide="search"></i><span>Search anything…</span><kbd>Ctrl K</kbd>
      </div>
      <button class="btn btn-primary" id="addBtn"><i data-lucide="plus"></i><span>Add New</span></button>
    </header>

    <section id="view" class="view"></section>
  </main>

  <div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>

  <!-- ============ MODAL ============ -->
  <div class="modal" id="modal">
    <form class="modal-box" id="form">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button type="button" class="icon-btn" onclick="closeModal()"><i data-lucide="x"></i></button>
      </div>
      <div class="form-grid" id="formFields"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary"><i data-lucide="check"></i>Save</button>
      </div>
    </form>
  </div>

  <!-- ============ SEARCH PALETTE ============ -->
  <div class="modal" id="palette">
    <div class="modal-box palette">
      <div class="palette-input"><i data-lucide="search"></i><input id="paletteInput" placeholder="Search contacts, companies, deals, tasks…" autocomplete="off" /></div>
      <div id="paletteResults"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <script src="/static/app.js"></script>
</body>
</html>
